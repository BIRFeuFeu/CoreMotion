name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Sintaxe + lint + testes de UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências de desenvolvimento
        run: npm ci

      - name: Sintaxe de todos os scripts
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Formatação (arquivos novos/ferramentas)
        run: npm run format:check

      - name: Teste de integração da UI (jsdom + Supabase simulado)
        run: npm test

      - name: Migrações conferem com o schema.sql
        run: bash db/verify-migrations.sh
